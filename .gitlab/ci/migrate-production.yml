migrate:production:
  stage: production
  image: docker:29.1-cli
  tags:
    - homelab-vm100-deploy
  environment:
    name: production
    action: prepare
  resource_group: mypocket-production-db
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
    - when: never
  allow_failure: false
  script:
    - set -eu
    - : "${MYPOCKET_IMAGE_REF:?MYPOCKET_IMAGE_REF must be an immutable registry.dungxbuif.com image reference}"
    - : "${DATABASE_URL:?DATABASE_URL must be set with production environment scope}"
    - : "${MYPOCKET_MIGRATION_NETWORK:?MYPOCKET_MIGRATION_NETWORK must name the production Docker network}"
    - case "${MYPOCKET_IMAGE_REF}" in registry.dungxbuif.com/*@sha256:*|registry.dungxbuif.com/*:[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]*) ;; *) echo 'MYPOCKET_IMAGE_REF must use registry.dungxbuif.com and an immutable digest or commit tag' >&2; exit 1 ;; esac
    - if [ -n "${REGISTRY_USERNAME:-}" ]; then printf '%s' "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required with REGISTRY_USERNAME}" | docker login registry.dungxbuif.com --username "${REGISTRY_USERNAME}" --password-stdin; fi
    - docker pull "${MYPOCKET_IMAGE_REF}"
    - before="$(docker run --rm --network "${MYPOCKET_MIGRATION_NETWORK}" -e DATABASE_URL -e MIGRATIONS_PATH=/app/migrations "${MYPOCKET_IMAGE_REF}" /app/migrate version)"
    - printf '%s\n' "${before}"
    - printf '%s\n' "${before}" | grep -Fq 'dirty: false'
    - docker run --rm --network "${MYPOCKET_MIGRATION_NETWORK}" -e DATABASE_URL -e MIGRATIONS_PATH=/app/migrations "${MYPOCKET_IMAGE_REF}" /app/migrate up
    - after="$(docker run --rm --network "${MYPOCKET_MIGRATION_NETWORK}" -e DATABASE_URL -e MIGRATIONS_PATH=/app/migrations "${MYPOCKET_IMAGE_REF}" /app/migrate version)"
    - printf '%s\n' "${after}"
    - printf '%s\n' "${after}" | grep -Fq "version: ${MYPOCKET_EXPECTED_MIGRATION_VERSION:-53} dirty: false"
