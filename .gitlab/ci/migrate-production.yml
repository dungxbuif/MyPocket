migrate:production:
  stage: production
  image: docker:29.1-cli
  tags:
    - homelab-vm100-deploy
  environment:
    name: production
    action: prepare
  resource_group: mypocket-production-db
  # Frozen 2026-11-01 release contract: only homelab-ops may migrate or deploy
  # production. Keep this legacy job inert so an old UI bookmark cannot bypass
  # the receipt-tag pipeline.
  needs:
    - job: build
      artifacts: true
  rules:
    - when: never
  # Keep the protected admin action available without blocking code-only
  # main pipelines when the release does not require a schema migration.
  allow_failure: true
  script:
    - |
      set -eu
      : "${MYPOCKET_IMAGE_REF:?MYPOCKET_IMAGE_REF must be an immutable registry.dungxbuif.com image reference}"
      : "${DATABASE_URL:?DATABASE_URL must be set with production environment scope}"
      : "${MYPOCKET_MIGRATION_NETWORK:?MYPOCKET_MIGRATION_NETWORK must name the production Docker network}"
      image_ref="${BUILT_IMAGE_REF:-${MYPOCKET_IMAGE_REF}}"
      case "${image_ref}" in registry.dungxbuif.com/*@sha256:*|registry.dungxbuif.com/*:[0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F][0-9a-fA-F]*) ;; *) echo 'image reference must use registry.dungxbuif.com and an immutable digest or commit tag' >&2; exit 1 ;; esac
      if [ -n "${REGISTRY_USERNAME:-}" ]; then printf '%s' "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD is required with REGISTRY_USERNAME}" | docker login registry.dungxbuif.com --username "${REGISTRY_USERNAME}" --password-stdin; fi
      docker pull "${image_ref}"
      before="$(docker run --rm --entrypoint /app/migrate --network "${MYPOCKET_MIGRATION_NETWORK}" -e DATABASE_URL -e MIGRATIONS_PATH=/app/migrations "${image_ref}" version)"
      printf '%s\n' "${before}"
      printf '%s\n' "${before}" | grep -Fq 'dirty: false'
      docker run --rm --entrypoint /app/migrate --network "${MYPOCKET_MIGRATION_NETWORK}" -e DATABASE_URL -e MIGRATIONS_PATH=/app/migrations "${image_ref}" up
      after="$(docker run --rm --entrypoint /app/migrate --network "${MYPOCKET_MIGRATION_NETWORK}" -e DATABASE_URL -e MIGRATIONS_PATH=/app/migrations "${image_ref}" version)"
      printf '%s\n' "${after}"
      printf '%s\n' "${after}" | grep -Fq "version: ${MYPOCKET_EXPECTED_MIGRATION_VERSION:-53} dirty: false"
