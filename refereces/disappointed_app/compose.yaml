services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mypocket
      POSTGRES_USER: mypocket
      POSTGRES_PASSWORD: mypocket
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypocket -d mypocket"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q 's3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${MYPOCKET_REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://mypocket:mypocket@postgres:5432/mypocket?sslmode=disable
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:-http://127.0.0.1:5173}"
      COOKIE_SECRET: change-this-development-cookie-secret-32-bytes
      CSRF_SECRET: change-this-development-csrf-secret-32-bytes
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://mypocket:mypocket@postgres:5432/mypocket?sslmode=disable
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:-http://127.0.0.1:5173}"
      COOKIE_SECRET: change-this-development-cookie-secret-32-bytes
      CSRF_SECRET: change-this-development-csrf-secret-32-bytes
      HTTP_ADDR: :8080
      DOCS_DIR: /app/docs
      OAUTH_FIXTURE_MODE: "${OAUTH_FIXTURE_MODE:-false}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URL: "${GOOGLE_REDIRECT_URL:-http://127.0.0.1:8080/api/v1/auth/google/callback}"
      ALLOWED_LOGIN_EMAILS: "${ALLOWED_LOGIN_EMAILS:-dungbui.dungbui.00@gmail.com}"
      API_KEY_HASH_SECRET: "${API_KEY_HASH_SECRET:-change-this-development-api-key-hash-secret-32-bytes}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      AUDIT_VIEWER_EMAIL: "${AUDIT_VIEWER_EMAIL:-dungbui.dungbui.00@gmail.com}"
      AUDIT_HASH_SECRET: "${AUDIT_HASH_SECRET:-change-this-development-audit-hash-32-bytes}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-180}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      S3_ENDPOINT: http://s3:4566
      S3_BUCKET: mypocket
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT: "${AI_TIMEOUT:-30s}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES:-2}"
      OCR_ENABLED: "${OCR_ENABLED:-false}"
      OCR_BASE_URL: "${OCR_BASE_URL:-}"
      OCR_API_KEY: "${OCR_API_KEY:-}"
      OCR_TIMEOUT: "${OCR_TIMEOUT:-30s}"
      OCR_POLL_INTERVAL: "${OCR_POLL_INTERVAL:-5s}"
      OCR_MAX_PROCESSING_TIME: "${OCR_MAX_PROCESSING_TIME:-10m}"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    entrypoint: ["/app/worker"]
    environment:
      WEB_PUSH_ENABLED: "false"
      APP_ENV: development
      DATABASE_URL: postgres://mypocket:mypocket@postgres:5432/mypocket?sslmode=disable
      PUBLIC_WEB_URL: "${PUBLIC_WEB_URL:-http://127.0.0.1:5173}"
      COOKIE_SECRET: change-this-development-cookie-secret-32-bytes
      CSRF_SECRET: change-this-development-csrf-secret-32-bytes
      API_KEY_HASH_SECRET: "${API_KEY_HASH_SECRET:-change-this-development-api-key-hash-secret-32-bytes}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      AUDIT_VIEWER_EMAIL: "${AUDIT_VIEWER_EMAIL:-dungbui.dungbui.00@gmail.com}"
      AUDIT_HASH_SECRET: "${AUDIT_HASH_SECRET:-change-this-development-audit-hash-32-bytes}"
      AUDIT_RETENTION_DAYS: "${AUDIT_RETENTION_DAYS:-180}"
      LOG_FORMAT: "${LOG_FORMAT:-text}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PORTFOLIO_STATIC_PRICES_JSON: "${PORTFOLIO_STATIC_PRICES_JSON:-}"
      S3_ENDPOINT: http://s3:4566
      S3_BUCKET: mypocket
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
      AI_ENABLED: "${AI_ENABLED:-false}"
      AI_BASE_URL: "${AI_BASE_URL:-}"
      AI_API_KEY: "${AI_API_KEY:-}"
      AI_MODEL: "${AI_MODEL:-}"
      AI_TIMEOUT: "${AI_TIMEOUT:-30s}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES:-2}"
      OCR_ENABLED: "${OCR_ENABLED:-false}"
      OCR_BASE_URL: "${OCR_BASE_URL:-}"
      OCR_API_KEY: "${OCR_API_KEY:-}"
      OCR_TIMEOUT: "${OCR_TIMEOUT:-30s}"
      OCR_POLL_INTERVAL: "${OCR_POLL_INTERVAL:-5s}"
      OCR_MAX_PROCESSING_TIME: "${OCR_MAX_PROCESSING_TIME:-10m}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_WEB_PUSH_PUBLIC_KEY: "${VAPID_PUBLIC_KEY:-}"
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
