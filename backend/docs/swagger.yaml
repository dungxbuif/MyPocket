basePath: /
definitions:
  entity.AIEntryDraft:
    properties:
      amount:
        type: integer
      category_id:
        type: string
      included_in_reports:
        type: boolean
      note:
        type: string
      occurred_at:
        type: string
      type:
        type: string
      wallet_id:
        type: string
    type: object
  entity.AIEntryMessage:
    properties:
      content:
        type: string
      created_at:
        type: string
      id:
        type: string
      role:
        type: string
    type: object
  entity.AIEntryProposal:
    properties:
      created_at:
        type: string
      draft:
        $ref: '#/definitions/entity.AIEntryDraft'
      id:
        type: string
      questions:
        items:
          type: string
        type: array
      session_id:
        type: string
      status:
        type: string
      transaction_id:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  entity.AIEntrySession:
    properties:
      created_at:
        type: string
      error:
        type: string
      id:
        type: string
      messages:
        items:
          $ref: '#/definitions/entity.AIEntryMessage'
        type: array
      processing:
        type: boolean
      proposals:
        items:
          $ref: '#/definitions/entity.AIEntryProposal'
        type: array
      updated_at:
        type: string
    type: object
  entity.AIImage:
    properties:
      base64:
        type: string
      mime_type:
        type: string
      name:
        type: string
    type: object
  entity.Budget:
    properties:
      category_id:
        type: string
      created_at:
        type: string
      days_remaining:
        type: integer
      end_at:
        type: string
      ended:
        type: boolean
      id:
        type: string
      limit_amount:
        type: integer
      name:
        type: string
      owner_id:
        type: string
      spent:
        type: integer
      start_at:
        type: string
      updated_at:
        type: string
      wallet_id:
        type: string
    type: object
  entity.BudgetSummary:
    properties:
      items:
        items:
          $ref: '#/definitions/entity.Budget'
        type: array
      limit_amount:
        type: integer
      spent:
        type: integer
    type: object
  entity.Category:
    properties:
      created_at:
        type: string
      icon_key:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      kind:
        type: string
      name:
        type: string
      owner_id:
        type: string
      parent_id:
        type: string
      system_key:
        type: string
      updated_at:
        type: string
      wallet_ids:
        items:
          type: string
        type: array
    type: object
  entity.Transaction:
    properties:
      amount:
        type: integer
      category_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      included_in_reports:
        type: boolean
      note:
        type: string
      occurred_at:
        type: string
      owner_id:
        type: string
      type:
        type: string
      updated_at:
        type: string
      wallet_id:
        type: string
    type: object
  entity.Wallet:
    properties:
      created_at:
        type: string
      credit_limit:
        type: integer
      currency:
        type: string
      current_balance:
        type: integer
      description:
        type: string
      id:
        type: string
      is_in_total:
        type: boolean
      last_statement_balance:
        type: integer
      name:
        type: string
      opening_balance:
        type: integer
      owner_id:
        type: string
      payment_due_day:
        type: integer
      statement_day:
        type: integer
      target_amount:
        type: integer
      target_date:
        type: string
      type:
        type: string
      updated_at:
        type: string
    type: object
  httpapi.Problem:
    properties:
      code:
        type: string
      detail:
        type: string
      instance:
        type: string
      request_id:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  httpapi.Response:
    properties:
      data: {}
      meta: {}
    type: object
  httpapi.aiProposalDecision:
    properties:
      version:
        type: integer
    type: object
  httpapi.aiProposalEdit:
    properties:
      draft:
        $ref: '#/definitions/entity.AIEntryDraft'
      version:
        type: integer
    type: object
  httpapi.budgetInput:
    properties:
      category_id:
        type: string
      end_at:
        type: string
      limit_amount:
        type: integer
      name:
        type: string
      start_at:
        type: string
      wallet_id:
        type: string
    type: object
  httpapi.categoryInput:
    properties:
      icon_key:
        type: string
      kind:
        type: string
      name:
        type: string
      parent_id:
        type: string
      wallet_ids:
        items:
          type: string
        type: array
    type: object
  httpapi.categoryWalletInput:
    properties:
      wallet_ids:
        items:
          type: string
        type: array
    type: object
  httpapi.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  httpapi.transactionInput:
    properties:
      amount:
        type: integer
      category_id:
        type: string
      included_in_reports:
        type: boolean
      note:
        type: string
      occurred_at:
        type: string
      type:
        type: string
      wallet_id:
        type: string
    type: object
  httpapi.walletInput:
    properties:
      credit_limit:
        type: integer
      description:
        type: string
      is_in_total:
        type: boolean
      name:
        type: string
      opening_balance:
        type: integer
      target_amount:
        type: integer
      target_date:
        type: string
      type:
        type: string
    type: object
  usecase.AIEntryMessageInput:
    properties:
      images:
        items:
          $ref: '#/definitions/entity.AIImage'
        type: array
      request_id:
        type: string
      text:
        type: string
      timezone:
        type: string
    type: object
  usecase.HomeOutput:
    properties:
      greeting:
        type: string
      notice:
        type: string
      stats:
        properties:
          notes_count:
            type: integer
          wallet_count:
            type: integer
        type: object
    type: object
  usecase.LoginOutput:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/usecase.UserProfile'
    type: object
  usecase.UserProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Current implemented API surface for local development.
  title: MyPocket API
  version: 0.1.0
paths:
  /api/v1/ai/entry/capabilities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Response'
      security:
      - BearerAuth: []
      summary: AI entry configuration availability
      tags:
      - AI Entry
  /api/v1/ai/entry/proposals/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Proposal ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft and expected version
        in: body
        name: proposal
        required: true
        schema:
          $ref: '#/definitions/httpapi.aiProposalEdit'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntryProposal'
      security:
      - BearerAuth: []
      summary: Edit a pending AI proposal without changing ledger
      tags:
      - AI Entry
  /api/v1/ai/entry/proposals/{id}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Proposal ID
        in: path
        name: id
        required: true
        type: string
      - description: Expected version
        in: body
        name: decision
        required: true
        schema:
          $ref: '#/definitions/httpapi.aiProposalDecision'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntryProposal'
      security:
      - BearerAuth: []
      summary: Approve a proposal and atomically create its ledger transaction once
      tags:
      - AI Entry
  /api/v1/ai/entry/proposals/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Proposal ID
        in: path
        name: id
        required: true
        type: string
      - description: Expected version
        in: body
        name: decision
        required: true
        schema:
          $ref: '#/definitions/httpapi.aiProposalDecision'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntryProposal'
      security:
      - BearerAuth: []
      summary: Reject a proposal without changing ledger
      tags:
      - AI Entry
  /api/v1/ai/entry/sessions:
    post:
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.AIEntrySession'
      security:
      - BearerAuth: []
      summary: Create an owner-scoped AI entry chat
      tags:
      - AI Entry
  /api/v1/ai/entry/sessions/{id}:
    get:
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntrySession'
      security:
      - BearerAuth: []
      summary: Read AI entry chat and proposals
      tags:
      - AI Entry
  /api/v1/ai/entry/sessions/{id}/messages:
    post:
      consumes:
      - application/json
      parameters:
      - description: Session ID
        in: path
        name: id
        required: true
        type: string
      - description: Message
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/usecase.AIEntryMessageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntrySession'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Extract reviewable drafts from text and OCR-first images
      tags:
      - AI Entry
  /api/v1/ai/entry/sessions/latest:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntrySession'
      security:
      - BearerAuth: []
      summary: Resume latest AI entry chat
      tags:
      - AI Entry
  /api/v1/auth/google:
    get:
      parameters:
      - description: Absolute frontend callback URL
        in: query
        name: frontend_callback
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to Google authorization
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start Google OAuth login
      tags:
      - Authentication
  /api/v1/auth/google/callback:
    get:
      parameters:
      - description: Google authorization code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      - description: OAuth error
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.LoginOutput'
        "302":
          description: Redirect to frontend callback
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete Google OAuth login
      tags:
      - Authentication
  /api/v1/auth/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.UserProfile'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - Account
  /api/v1/budgets:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.BudgetSummary'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: List budgets with ledger-derived progress and active deduplicated totals
      tags:
      - Budgets
    post:
      consumes:
      - application/json
      parameters:
      - description: Budget input
        in: body
        name: budget
        required: true
        schema:
          $ref: '#/definitions/httpapi.budgetInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Budget'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Create a budget for an explicit interval
      tags:
      - Budgets
  /api/v1/budgets/{id}:
    delete:
      parameters:
      - description: Budget ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Delete budget configuration without changing transactions
      tags:
      - Budgets
    patch:
      consumes:
      - application/json
      parameters:
      - description: Budget ID
        in: path
        name: id
        required: true
        type: string
      - description: Budget input
        in: body
        name: budget
        required: true
        schema:
          $ref: '#/definitions/httpapi.budgetInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Budget'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Replace budget configuration before its interval has ended
      tags:
      - Budgets
  /api/v1/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Category'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: List visible categories
      tags:
