basePath: /
definitions:
  entity.Category:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      kind:
        type: string
      name:
        type: string
      owner_id:
        type: string
      parent_id:
        type: string
      system_key:
        type: string
      updated_at:
        type: string
    type: object
  httpapi.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  usecase.HomeOutput:
    properties:
      greeting:
        type: string
      notice:
        type: string
      stats:
        properties:
          notes_count:
            type: integer
          wallet_count:
            type: integer
        type: object
    type: object
  usecase.LoginOutput:
    properties:
      expires_at:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/usecase.UserProfile'
    type: object
  usecase.UserProfile:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Current implemented API surface for local development.
  title: MyPocket API
  version: 0.1.0
paths:
  /api/v1/auth/google:
    get:
      parameters:
      - description: Absolute frontend callback URL
        in: query
        name: frontend_callback
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to Google authorization
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start Google OAuth login
      tags:
      - Authentication
  /api/v1/auth/google/callback:
    get:
      parameters:
      - description: Google authorization code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      - description: OAuth error
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.LoginOutput'
        "302":
          description: Redirect to frontend callback
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete Google OAuth login
      tags:
      - Authentication
  /api/v1/auth/profile:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.UserProfile'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get authenticated user profile
      tags:
      - Account
  /api/v1/categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Category'
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List visible categories
      tags:
      - Categories
  /api/v1/home:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.HomeOutput'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get authenticated home summary
      tags:
      - Account
  /api/v1/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.LoginOutput'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login with email and password
      tags:
      - Authentication
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
