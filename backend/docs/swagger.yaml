host: localhost:8080
info:
  contact: {}
  description: Current implemented API surface for local development.
  title: MyPocket API
  version: 0.1.0
paths:
  /api/v1/agent/feedback:
    get:
      parameters:
      - description: open, triaged, in_progress, fixed, rejected
        in: query
        name: status
        type: string
      - description: Maximum rows (1-100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.Feedback'
            type: array
      security:
      - BearerAuth: []
      summary: List feedback for the local development agent
      tags:
      - Feedback Agent
  /api/v1/agent/feedback/{id}/screenshot:
    get:
      parameters:
      - description: Feedback ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
      security:
      - BearerAuth: []
      summary: Get a short-lived feedback screenshot URL for the local agent
      tags:
      - Feedback Agent
  /api/v1/ai/advisor/capabilities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Read Finance Assistant capabilities
      tags:
      - AI Advisor
  /api/v1/ai/advisor/conversation/messages:
    get:
      parameters:
      - description: Read messages before sequence
        in: query
        name: before_seq
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.AdvisorMessage'
            type: array
      security:
      - BearerAuth: []
      summary: Read persisted Finance Assistant messages
      tags:
      - AI Advisor
  /api/v1/ai/advisor/messages:
    post:
      consumes:
      - application/json
      parameters:
      - description: Question
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/httpapi.advisorMessageInput'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.advisorSubmitResponse'
      security:
      - BearerAuth: []
      summary: Submit a Finance Assistant read-only question
      tags:
      - AI Advisor
  /api/v1/ai/advisor/overview:
    get:
      parameters:
      - description: Account-local calendar month YYYY-MM
        in: query
        name: month
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Read Finance Assistant overview without calling the model
      tags:
      - AI Advisor
  /api/v1/ai/advisor/runs/{id}:
    get:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AdvisorRun'
      security:
      - BearerAuth: []
      summary: Read one Finance Assistant run
      tags:
      - AI Advisor
  /api/v1/ai/advisor/runs/{id}/cancel:
    post:
      parameters:
      - description: Run ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Cancel a queued or running Finance Assistant run
      tags:
      - AI Advisor
  /api/v1/ai/entry/capabilities:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Response'
      security:
      - BearerAuth: []
      summary: AI entry configuration availability
      tags:
      - AI Entry
  /api/v1/ai/entry/process:
    post:
      consumes:
      - multipart/form-data
      parameters:
      - description: Idempotency UUID
        in: formData
        name: request_id
        required: true
        type: string
      - description: Transaction description
        in: formData
        name: text
        type: string
      - description: IANA timezone
        in: formData
        name: timezone
        required: true
        type: string
      - description: JPEG, PNG, or PDF, up to twenty files
        in: formData
        name: files
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Process one text and optional file submission into reviewable transaction
        proposals
      tags:
      - AI Entry
  /api/v1/ai/entry/proposals/{id}:
    patch:
      consumes:
      - application/json
      parameters:
      - description: Proposal ID
        in: path
        name: id
        required: true
        type: string
      - description: Draft and expected version
        in: body
        name: proposal
        required: true
        schema:
          $ref: '#/definitions/httpapi.aiProposalEdit'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntryProposal'
      security:
      - BearerAuth: []
      summary: Edit a pending AI proposal without changing ledger
      tags:
      - AI Entry
  /api/v1/ai/entry/proposals/{id}/approve:
    post:
      consumes:
      - application/json
      parameters:
      - description: Proposal ID
        in: path
        name: id
        required: true
        type: string
      - description: Expected version
        in: body
        name: decision
        required: true
        schema:
          $ref: '#/definitions/httpapi.aiProposalDecision'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntryProposal'
      security:
      - BearerAuth: []
      summary: Approve a proposal and atomically create its ledger transaction once
      tags:
      - AI Entry
  /api/v1/ai/entry/proposals/{id}/reject:
    post:
      consumes:
      - application/json
      parameters:
      - description: Proposal ID
        in: path
        name: id
        required: true
        type: string
      - description: Expected version
        in: body
        name: decision
        required: true
        schema:
          $ref: '#/definitions/httpapi.aiProposalDecision'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.AIEntryProposal'
      security:
      - BearerAuth: []
      summary: Reject a proposal without changing ledger
      tags:
      - AI Entry
  /api/v1/ai/entry/requests/{request_id}:
    get:
      parameters:
      - description: Idempotency UUID
        in: path
        name: request_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Response'
      security:
      - BearerAuth: []
      summary: Read one-shot AI process status and proposals by idempotency key
      tags:
      - AI Entry
  /api/v1/api-keys:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/entity.UserAPIKey'
            type: array
      security:
      - BearerAuth: []
      summary: List current user's API keys
      tags:
      - API Keys
    post:
      consumes:
      - application/json
      parameters:
      - description: API key configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/httpapi.apiKeyCreateInput'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httpapi.apiKeyCreatedResponse'
      security:
      - BearerAuth: []
      summary: Create a user API key
      tags:
      - API Keys
  /api/v1/api-keys/{id}:
    delete:
      parameters:
      - description: API key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Revoke a current user's API key
      tags:
      - API Keys
  /api/v1/auth/google:
    get:
      parameters:
      - description: Absolute frontend callback URL
        in: query
        name: frontend_callback
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Redirect to Google authorization
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "501":
          description: Not Implemented
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Start Google OAuth login
      tags:
      - Authentication
  /api/v1/auth/google/callback:
    get:
      parameters:
      - description: Google authorization code
        in: query
        name: code
        type: string
      - description: OAuth state
        in: query
        name: state
        type: string
      - description: OAuth error
        in: query
        name: error
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/usecase.LoginOutput'
        "302":
          description: Redirect to frontend callback
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Complete Google OAuth login
      tags:
