[project]
name = "mypocket-finance-assistant"
version = "0.1.0"
description = "Channel-neutral, memory-enabled Finance Assistant for MyPocket"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.3",
  "httpx==0.28.1",
  "langchain-openai==0.3.35",
  "langgraph==1.0.1",
  "langgraph-checkpoint-postgres==3.0.5",
  "langmem==0.0.30",
  "psycopg[binary,pool]==3.3.8",
  "pydantic-settings==2.16.2",
  "PyJWT[crypto]==2.15.1",
  "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "respx==0.23.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_assistant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
