services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mypocket
      POSTGRES_USER: mypocket
      POSTGRES_PASSWORD: mypocket
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mypocket -d mypocket"]
      interval: 3s
      timeout: 3s
      retries: 20

  s3:
    image: localstack/localstack:3.8.1
    environment:
      SERVICES: s3
      DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health | grep -q 's3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["/app/migrate"]
    environment:
      DATABASE_URL: postgres://mypocket:mypocket@postgres:5432/mypocket?sslmode=disable
      PUBLIC_WEB_URL: http://web:80
      COOKIE_SECRET: change-this-development-cookie-secret-32-bytes
      CSRF_SECRET: change-this-development-csrf-secret-32-bytes
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://mypocket:mypocket@postgres:5432/mypocket?sslmode=disable
      PUBLIC_WEB_URL: http://web:80
      COOKIE_SECRET: change-this-development-cookie-secret-32-bytes
      CSRF_SECRET: change-this-development-csrf-secret-32-bytes
      HTTP_ADDR: :8080
      OAUTH_FIXTURE_MODE: "true"
      S3_ENDPOINT: http://s3:4566
      S3_BUCKET: mypocket
      S3_ACCESS_KEY: test
      S3_SECRET_KEY: test
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      s3:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    entrypoint: ["/app/worker"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://mypocket:mypocket@postgres:5432/mypocket?sslmode=disable
      PUBLIC_WEB_URL: http://web:80
      COOKIE_SECRET: change-this-development-cookie-secret-32-bytes
      CSRF_SECRET: change-this-development-csrf-secret-32-bytes
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_started
