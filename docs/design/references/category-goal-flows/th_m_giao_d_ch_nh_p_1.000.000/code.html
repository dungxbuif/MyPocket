<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Thêm Giao Dịch</title>
<!-- Tailwind CSS v3 with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Custom configuration for Tailwind -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            appBg: '#EFF1F5',
            appSheetBg: '#F6F7FA',
            appGreen: '#22B14C',
            appGreenLight: '#E8F5EB',
          }
        }
      }
    }
  </script>
<!-- Typography styles -->
<style data-purpose="typography">
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
  </style>
<!-- Custom layout styling -->
<style data-purpose="custom-layout">
    /* Subtle inner shadow for segmented control bar */
    .segmented-bg {
      background-color: #E7E9EE;
    }
  </style>
</head>
<body class="bg-stone-300 min-h-screen flex justify-center items-start sm:py-6 select-none text-slate-900">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[420px] bg-white min-h-screen sm:min-h-[890px] sm:rounded-[48px] shadow-2xl overflow-hidden flex flex-col relative">
<!-- BEGIN: iOSStatusBar -->
<!-- Top System Status Bar Simulation -->
<div class="h-12 w-full pt-3 px-8 flex items-center justify-between z-20" data-purpose="status-bar">
<span class="text-[17px] font-bold tracking-tight text-black">22:20</span>
<div class="flex items-center space-x-2 text-black">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.2.2-.2.51 0 .71.2.2.51.2.71 0l.64-.64C7.24 19.34 9.47 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" opacity="0"></path>
<rect height="6" rx="1" width="3" x="2" y="15"></rect>
<rect height="10" rx="1" width="3" x="7" y="11"></rect>
<rect height="14" rx="1" width="3" x="12" y="7"></rect>
<rect height="18" rx="1" width="3" x="17" y="3"></rect>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.21 1.5 9.74 3.93L12 19.14 2.26 11.43C4.79 9 8.22 7.5 12 7.5z"></path>
</svg>
<!-- iOS Battery Indicator with Percentage -->
<div class="flex items-center bg-[#4CD964] text-white px-1.5 py-0.5 rounded-full text-[11px] font-bold">
<span>37</span>
<svg class="w-2.5 h-2.5 ml-0.5 fill-current" viewbox="0 0 24 24">
<path d="M7 2v11h3v9l7-12h-4l4-8z"></path>
</svg>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- BEGIN: ModalContainer -->
<!-- Modal Presentation View with distinct curved top & background -->
<main class="flex-1 bg-[#F4F5F8] rounded-t-[36px] flex flex-col pt-3 px-4 pb-6 transition-all">
<!-- BEGIN: ModalHeader -->
<header class="relative flex items-center justify-between py-2 px-1 mb-3" data-purpose="modal-header">
<!-- Cancel Button styled as iOS pill/circle button -->
<button class="bg-white text-slate-800 font-medium text-[16px] px-5 py-2.5 rounded-full shadow-sm active:scale-95 transition-transform" type="button">
          Huỷ
        </button>
<!-- Modal Title -->
<h1 class="absolute left-1/2 -translate-x-1/2 text-[18px] font-bold text-slate-900 tracking-tight">
          Thêm Giao Dịch
        </h1>
<!-- Empty placeholder to balance flex row layout -->
<div class="w-12"></div>
</header>
<!-- END: ModalHeader -->
<!-- BEGIN: MainContentScroll -->
<div class="flex-1 overflow-y-auto space-y-4">
<!-- BEGIN: TransactionTypeSegmentedControl -->
<!-- Tab selector between Expense (Khoản chi) and Income (Khoản thu) -->
<section class="bg-white rounded-3xl p-3 shadow-sm" data-purpose="form-main-card">
<div class="segmented-bg p-1 rounded-2xl flex items-center mb-4" data-purpose="segment-control">
<button class="flex-1 bg-white text-slate-900 font-semibold text-[15px] py-2 rounded-xl shadow-sm text-center" type="button">
              Khoản chi
            </button>
<button class="flex-1 text-slate-700 font-medium text-[15px] py-2 rounded-xl text-center" type="button">
              Khoản thu
            </button>
</div>
<!-- END: TransactionTypeSegmentedControl -->
<!-- BEGIN: FormFieldsList -->
<div class="divide-y divide-slate-100">
<!-- Row 1: Account / Wallet Selection -->
<div class="flex items-center justify-between py-3.5 px-2 active:bg-slate-50 rounded-xl cursor-pointer" data-purpose="field-account">
<div class="flex items-center space-x-3.5">
<!-- Wallet Icon Box -->
<div class="w-9 h-9 rounded-xl bg-[#E77843] flex items-center justify-center text-white shadow-sm">
<svg class="w-5 h-5" fill="currentColor" viewbox="0 0 24 24">
<path d="M21 7.28V5c0-1.1-.9-2-2-2H5a2 2 0 00-2 2v14a2 2 0 002 2h14c1.1 0 2-.9 2-2v-2.28c.59-.35 1-.99 1-1.72V9c0-.73-.41-1.37-1-1.72zM20 9v6h-3a3 3 0 01-3-3 3 3 0 013-3h3zM5 5h14v1.72c-.31.18-.58.43-.78.73A3.996 3.996 0 0017 7H5V5zm14 14H5V9h11.22c-.14.31-.22.65-.22 1 0 1.66 1.34 3 3 3h1v6z"></path>
</svg>
</div>
<span class="text-[17px] font-semibold text-slate-800">Test</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Row 2: Amount Field -->
<div class="py-3 px-2" data-purpose="field-amount">
<div class="text-[13px] font-medium text-slate-400 mb-1 ml-[52px]">Số tiền</div>
<div class="flex items-center space-x-3.5">
<!-- Currency Badge (VND) -->
<div class="w-10 h-8 rounded-lg border border-slate-300 flex items-center justify-center text-[12px] font-bold text-slate-500 bg-white">
                  VND
                </div>
<!-- Prominent Amount Display -->
<div class="text-[34px] font-extrabold text-slate-900 tracking-tight">
                  1.000.000
                </div>
</div>
</div>
<!-- Row 3: Category Picker Placeholder -->
<div class="flex items-center justify-between py-4 px-2 active:bg-slate-50 rounded-xl cursor-pointer" data-purpose="field-category">
<div class="flex items-center space-x-3.5">
<!-- Circular Placeholder Icon -->
<div class="w-9 h-9 rounded-full bg-[#C2C6CF] flex items-center justify-center"></div>
<span class="text-[18px] text-slate-400 font-normal">Chọn nhóm</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Row 4: Note Field Placeholder -->
<div class="flex items-center justify-between py-4 px-2 active:bg-slate-50 rounded-xl cursor-pointer" data-purpose="field-note">
<div class="flex items-center space-x-3.5">
<!-- Note / List Icon -->
<div class="w-9 h-9 flex items-center justify-center text-slate-800">
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M4 6h16M4 12h10M4 18h7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[17px] text-slate-800 font-medium">Ghi chú</span>
</div>
<svg class="w-4 h-4 text-slate-400 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Row 5: Date Selector with Chevron Step Buttons -->
<div class="flex items-center justify-between py-3.5 px-2" data-purpose="field-date">
<div class="w-9 h-9 flex items-center justify-center text-slate-800">
<!-- Calendar Icon -->
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Date Stepper Controls -->
<div class="flex items-center space-x-2 flex-1 max-w-[285px] justify-end">
<!-- Previous Day Button -->
<button class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 active:bg-slate-200 transition" type="button">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Selected Date Badge -->
<div class="bg-slate-100/90 text-[#309A52] font-semibold text-[14px] py-1.5 px-4 rounded-xl flex-1 text-center truncate">
                  Chủ Nhật, 20/09/2026
                </div>
<!-- Next Day Button -->
<button class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 active:bg-slate-200 transition" type="button">
<svg class="w-4 h-4 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
</div>
<!-- END: FormFieldsList -->
</section>
<!-- END: FormCard -->
<!-- BEGIN: AddDetailButton -->
<!-- Pill button for adding more transaction details -->
<button class="w-full bg-white text-[#299E4A] font-semibold text-[15px] py-3.5 rounded-full shadow-sm active:bg-slate-50 transition" data-purpose="add-more-details-btn" type="button">
          Thêm chi tiết
        </button>
<!-- END: AddDetailButton -->
</div>
<!-- END: MainContentScroll -->
<!-- BEGIN: BottomActionBar -->
<!-- Fixed Bottom Action Bar with Save button & Camera button -->
<footer class="pt-4 flex items-center space-x-3" data-purpose="bottom-actions">
<!-- Disabled Save Button -->
<button class="flex-1 bg-[#C7C9CD] text-white font-bold text-[16px] py-3.5 rounded-full cursor-not-allowed shadow-none" disabled="" type="button">
          Lưu
        </button>
<!-- Photo/Attachment Action Button -->
<button aria-label="Đính kèm ảnh" class="w-12 h-12 rounded-full bg-[#27A844] text-white flex items-center justify-center shadow-md active:scale-95 transition-transform flex-shrink-0" type="button">
<svg class="w-6 h-6" fill="currentColor" viewbox="0 0 24 24">
<path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"></path>
<path d="M19 10h-2V8h-2v2h-2v2h2v2h2v-2h2z" fill="#ffffff" opacity="0.9"></path>
</svg>
</button>
</footer>
<!-- END: BottomActionBar -->
</main>
<!-- END: ModalContainer -->
<!-- iOS Home Indicator -->
<div class="h-5 w-full bg-[#F4F5F8] flex justify-center items-center pb-1">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
