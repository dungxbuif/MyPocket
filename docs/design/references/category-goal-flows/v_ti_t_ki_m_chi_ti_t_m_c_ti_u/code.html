<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Ví Tiết Kiệm - Financial Clarity</title>
<!-- Tailwind CSS v3 with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Manrope & Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
            mono: ['Inter', 'monospace'],
          },
          colors: {
            brand: {
              green: '#22c55e',
              darkGreen: '#16a34a',
              bgLight: '#f3f4f6',
              cardBg: '#f8fafc',
            },
            appBg: '#f5f6f8'
          },
          boxShadow: {
            'nav-fab': '0 8px 20px -4px rgba(34, 197, 94, 0.45)',
            'card-soft': '0 2px 8px rgba(0, 0, 0, 0.04)',
            'nav-bar': '0 -4px 16px rgba(0, 0, 0, 0.03)'
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Ẩn scrollbar chuẩn iOS */
    ::-webkit-scrollbar {
      display: none;
    }
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-slate-100 flex justify-center items-center min-h-screen text-slate-900 antialiased font-sans">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[428px] h-screen max-h-[926px] bg-[#fbf9f9] flex flex-col relative overflow-hidden shadow-2xl sm:rounded-[48px] sm:border-[8px] sm:border-slate-800">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full pt-3 px-7 pb-1 flex justify-between items-center text-slate-900 shrink-0 select-none z-30">
<!-- Time -->
<span class="font-semibold text-[15px] tracking-tight">22:21</span>
<!-- Dynamic Island / Speaker cutout simulation space -->
<div class="w-24 h-4 rounded-full"></div>
<!-- System Icons: Signal, Wifi, Battery -->
<div class="flex items-center space-x-2 text-slate-900">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 18 14">
<rect height="3" rx="0.6" width="2.5" x="0.5" y="10.5"></rect>
<rect height="6.5" rx="0.6" width="2.5" x="5" y="7"></rect>
<rect height="10" rx="0.6" width="2.5" x="9.5" y="3.5"></rect>
<rect height="13" rx="0.6" width="2.5" x="14" y="0.5"></rect>
</svg>
<!-- Wifi -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 11.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z"></path>
<path d="M4.8 7.3a4.5 4.5 0 016.4 0 .8.8 0 001.1-1.1 6.1 6.1 0 00-8.6 0 .8.8 0 001.1 1.1z"></path>
<path d="M2.2 4.6a8.2 8.2 0 0111.6 0 .8.8 0 101.1-1.1 9.8 9.8 0 00-13.8 0 .8.8 0 001.1 1.1z"></path>
</svg>
<!-- Battery with % label -->
<div class="flex items-center space-x-1 pl-0.5">
<div class="bg-emerald-500 text-white font-bold text-[10px] px-1 py-0.2 rounded-sm leading-tight flex items-center justify-center">
            38<span class="text-[8px] font-normal">%</span>
</div>
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center relative">
<div class="h-full bg-emerald-500 rounded-2xs w-2/5"></div>
<div class="absolute -right-1 w-0.5 h-1 bg-slate-700 rounded-r-xs"></div>
</div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopNavigationHeader -->
<nav class="px-5 pt-2 pb-3 flex items-center justify-between shrink-0 select-none z-20">
<!-- Left: Help Support Button -->
<button aria-label="Trợ giúp" class="w-10 h-10 rounded-full bg-slate-100/90 hover:bg-slate-200/80 flex items-center justify-center text-slate-700 transition" type="button">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3m0 3.5h.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Center: Wallet Selector Dropdown Capsule -->
<div class="flex items-center bg-slate-100/90 border border-slate-200/60 rounded-full py-1.5 px-3.5 gap-2 shadow-xs cursor-pointer active:scale-98 transition">
<div class="w-6 h-6 rounded-full bg-amber-500 flex items-center justify-center text-white shadow-xs">
<!-- Mini Wallet Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 20 20">
<path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z"></path>
<path clip-rule="evenodd" d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zm-4 3a1 1 0 100 2 1 1 0 000-2z" fill-rule="evenodd"></path>
</svg>
</div>
<span class="text-sm font-semibold text-slate-800">Sổ tiết kiệm</span>
<svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 9l4-4 4 4m0 6l-4 4-4-4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<!-- Right: Search & Action Menu Buttons -->
<div class="flex items-center space-x-2">
<button aria-label="Tìm kiếm" class="w-10 h-10 rounded-full bg-slate-100/90 hover:bg-slate-200/80 flex items-center justify-center text-slate-700 transition" type="button">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35m1.85-5.15a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<button aria-label="Tuỳ chọn khác" class="w-10 h-10 rounded-full bg-slate-100/90 hover:bg-slate-200/80 flex items-center justify-center text-slate-700 transition" type="button">
<svg class="w-5 h-5 text-slate-700 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M8 12h.01M12 12h.01M16 12h.01" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</nav>
<!-- END: TopNavigationHeader -->
<!-- BEGIN: MainScrollableContent -->
<main class="flex-1 overflow-y-auto pb-28">
<!-- BEGIN: BalanceSection -->
<section class="pt-2 text-center" data-purpose="wallet-balance-summary">
<p class="text-slate-500 text-xs font-medium tracking-wide">Số dư</p>
<h1 class="text-2xl sm:text-[26px] font-extrabold text-slate-900 tracking-tight mt-0.5">
          10.000.000 <span class="text-xl font-bold underline decoration-1 underline-offset-4">đ</span>
</h1>
<!-- Tab Navigation Underline -->
<div class="mt-4 border-b border-slate-200 px-6 flex justify-start">
<div class="relative pb-2.5">
<span class="text-xs font-bold tracking-wider text-slate-900 uppercase">Tất cả các giao dịch</span>
<div class="absolute bottom-0 left-0 right-0 h-[2.5px] bg-slate-900 rounded-full"></div>
</div>
</div>
</section>
<!-- END: BalanceSection -->
<!-- BEGIN: SavingsGoalCardSection -->
<section class="px-5 pt-5" data-purpose="savings-target-widget">
<!-- Target Info & Remaining Duration -->
<div class="text-center">
<span class="text-slate-500 text-xs font-semibold uppercase tracking-wider">Cần thêm</span>
<div class="text-[32px] sm:text-[34px] font-black text-slate-900 tracking-tight leading-tight mt-0.5">
            990.000.000 <span class="text-2xl font-bold underline decoration-2 underline-offset-4">đ</span>
</div>
<p class="text-slate-800 font-semibold text-lg mt-0.5">Còn 11 ngày</p>
</div>
<!-- Target Progress Bar -->
<div class="mt-4">
<div class="w-full bg-slate-200/80 rounded-full h-1.5 overflow-hidden flex">
<!-- 1% achieved representation -->
<div class="bg-emerald-500 h-full w-[2%] rounded-full transition-all duration-700"></div>
</div>
<div class="mt-1">
<span class="inline-block bg-slate-200 text-slate-600 text-[11px] font-semibold px-2 py-0.5 rounded-sm">Hôm nay</span>
</div>
</div>
<!-- Smart Insight Card -->
<article class="mt-3 bg-emerald-50/90 border border-emerald-100 rounded-2xl p-3.5 flex items-start space-x-3 text-emerald-950 shadow-2xs">
<!-- Lightbulb Icon -->
<div class="shrink-0 text-emerald-600 mt-0.5">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<p class="text-[13px] font-medium leading-snug text-emerald-900">
            Bạn nên tiết kiệm thêm <span class="font-bold">990.000.000 <span class="underline decoration-1">đ</span></span> nữa trong tháng này.
          </p>
</article>
<!-- Report Link CTA -->
<div class="text-center mt-3.5 pb-2">
<button class="text-emerald-600 text-sm font-semibold hover:text-emerald-700 transition" type="button">
            Xem báo cáo cho giai đoạn này
          </button>
</div>
</section>
<!-- END: SavingsGoalCardSection -->
<!-- BEGIN: TransactionsHistorySection -->
<section class="mt-4 px-4" data-purpose="monthly-transactions-list">
<div class="bg-white rounded-[26px] p-5 border border-slate-100 shadow-card-soft">
<!-- Month Heading and Monthly Balance Summary -->
<div class="flex justify-between items-baseline pb-4 border-b border-slate-100">
<h2 class="text-2xl font-bold text-slate-900 tracking-tight">Tháng 9 2026</h2>
<div class="text-base font-bold text-slate-900">
              +10.000.000 <span class="text-sm font-semibold underline decoration-1">đ</span>
</div>
</div>
<!-- Transactions Items List -->
<div class="divide-y divide-slate-100">
<!-- Transaction Item 1: Direct Transfer / Initial Deposit -->
<div class="py-3.5 flex items-center justify-between group cursor-pointer hover:bg-slate-50/50 rounded-xl px-1 transition">
<div class="flex items-center space-x-3.5">
<!-- Icon Wallet with Inbound Arrow Badge -->
<div class="relative w-11 h-11 rounded-full bg-slate-800 flex items-center justify-center shrink-0">
<!-- Wallet shape -->
<div class="w-6 h-4 bg-amber-600 rounded-sm relative flex items-center justify-end pr-0.5">
<div class="w-1.5 h-1.5 rounded-full bg-amber-200"></div>
</div>
<!-- Arrow badge -->
<div class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-cyan-600 text-white flex items-center justify-center shadow-xs">
<svg class="w-3 h-3 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 14l-7 7m0 0l-7-7m7 7V3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Transaction Title -->
<div>
<h3 class="text-sm font-bold text-slate-900">Tiền chuyển đến</h3>
<span class="text-xs text-slate-400 font-medium">Khoản nạp tiết kiệm</span>
</div>
</div>
<!-- Transaction Value -->
<div class="text-right">
<span class="text-[15px] font-bold text-sky-600">
                  10.000.000 <span class="underline decoration-1 text-xs">đ</span>
</span>
</div>
</div>
<!-- Transaction Item 2: Interest Yield / Thu Lãi -->
<div class="py-3.5 flex items-center justify-between group cursor-pointer hover:bg-slate-50/50 rounded-xl px-1 transition">
<div class="flex items-center space-x-3.5">
<!-- Interest Percent Icon -->
<div class="relative w-11 h-11 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0 font-extrabold text-sm">
<svg class="w-5 h-5 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M9 14l6-6m-5.5.5h.01m5.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div>
<h3 class="text-sm font-bold text-slate-900">Tiền lãi nhận được</h3>
<span class="text-xs text-slate-400 font-medium">Lãi suất định kỳ</span>
</div>
</div>
<!-- Transaction Value -->
<div class="text-right">
<span class="text-[15px] font-bold text-emerald-600">
                  +54.000 <span class="underline decoration-1 text-xs">đ</span>
</span>
</div>
</div>
</div>
</div>
</section>
<!-- END: TransactionsHistorySection -->
</main>
<!-- END: MainScrollableContent -->
<!-- BEGIN: FloatingBottomNavigation -->
<footer class="absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-200/80 px-4 pt-2 pb-6 z-40 shadow-nav-bar">
<div class="relative flex items-center justify-around">
<!-- Tab 1: Tổng quan -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-500 hover:text-slate-800 transition" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-semibold mt-1">Tổng quan</span>
</button>
<!-- Tab 2: Sổ giao dịch (Active Pill) -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-900 font-bold transition" type="button">
<div class="bg-slate-200/80 px-4 py-1 rounded-full flex items-center justify-center">
<svg class="w-5 h-5 text-slate-900 fill-none stroke-[2]" stroke="currentColor" viewbox="0 0 24 24">
<path d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<span class="text-[11px] font-bold mt-0.5 text-slate-900">Sổ giao dịch</span>
</button>
<!-- Center FAB Add Button -->
<div class="relative -top-5 flex justify-center items-center px-1">
<button aria-label="Thêm giao dịch mới" class="w-13 h-13 w-[52px] h-[52px] rounded-full bg-emerald-500 hover:bg-emerald-600 text-white flex items-center justify-center shadow-nav-fab transition-transform active:scale-95" type="button">
<svg class="w-7 h-7 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Tab 3: Ngân sách -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-500 hover:text-slate-800 transition" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-semibold mt-1">Ngân sách</span>
</button>
<!-- Tab 4: Tài khoản -->
<button class="flex flex-col items-center justify-center flex-1 py-1 text-slate-500 hover:text-slate-800 transition" type="button">
<svg class="w-6 h-6 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-semibold mt-1">Tài khoản</span>
</button>
</div>
<!-- Home Indicator Line for iOS -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto mt-3 opacity-60"></div>
</footer>
<!-- END: FloatingBottomNavigation -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
