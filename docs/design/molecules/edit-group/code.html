<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Sửa nhóm - Financial Clarity System</title>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with Forms & Container Queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          },
          colors: {
            appBg: '#f6f7fb',
            emeraldCustom: '#22c55e',
          },
          boxShadow: {
            card: '0 2px 8px -2px rgba(0, 0, 0, 0.04), 0 1px 4px -1px rgba(0, 0, 0, 0.02)',
            fab: '0 8px 20px -4px rgba(34, 197, 94, 0.45)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-resets">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      font-family: 'Manrope', sans-serif;
    }
    /* Hide scrollbars for clean app look */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-900">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[425px] h-[100vh] sm:h-[880px] bg-[#f8fafc] sm:rounded-[44px] overflow-hidden flex flex-col shadow-2xl relative border-slate-300 sm:border-[8px]">
<!-- BEGIN: iOSStatusBar -->
<header class="pt-3 pb-1 px-7 flex items-center justify-between z-20 shrink-0 select-none">

<span class="text-[15px] font-bold tracking-tight text-slate-900">21:31</span>
<!-- iOS Status Icons -->
<div class="flex items-center gap-2">
<!-- Cellular Signal -->
<svg class="w-4 h-3.5 fill-slate-900" fill="currentColor" viewbox="0 0 18 12">
<rect height="4" rx="0.6" width="2.5" x="0.5" y="8"></rect>
<rect height="6.5" rx="0.6" width="2.5" x="4.5" y="5.5"></rect>
<rect height="9" rx="0.6" width="2.5" x="8.5" y="3"></rect>
<rect height="11.5" rx="0.6" width="2.5" x="12.5" y="0.5"></rect>
</svg>
<!-- Wi-Fi Icon -->
<svg class="w-4 h-3.5 fill-slate-900" fill="currentColor" viewbox="0 0 16 12">
<path clip-rule="evenodd" d="M8 2.5C5.2 2.5 2.7 3.6 0.9 5.4C0.6 5.7 0.6 6.2 0.9 6.5L7.4 13C7.7 13.3 8.2 13.3 8.5 13L15.1 6.5C15.4 6.2 15.4 5.7 15.1 5.4C13.3 3.6 10.8 2.5 8 2.5ZM2.3 6.8C3.8 5.4 5.8 4.5 8 4.5C10.2 4.5 12.2 5.4 13.7 6.8L8 12.5L2.3 6.8Z" fill-rule="evenodd"></path>
</svg>
<!-- Battery Icon -->
<div class="flex items-center gap-0.5">
<div class="w-[25px] h-[12px] border-[1.5px] border-slate-900 rounded-[4px] p-0.5 flex items-center justify-start relative">
<div class="h-full bg-slate-900 rounded-[1.5px] w-[67%]"></div>
<span class="absolute inset-0 flex items-center justify-center text-[8px] font-bold text-slate-800 leading-none pl-0.5">67</span>
</div>
<div class="w-[1.5px] h-[4px] bg-slate-900 rounded-r-sm"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationBar -->
<nav class="px-5 py-3 flex items-center justify-between shrink-0 relative">
<!-- Back Button -->
<button aria-label="Quay lại" class="w-10 h-10 rounded-full bg-white flex items-center justify-center shadow-[0_2px_8px_rgba(0,0,0,0.06)] active:scale-95 transition-transform">
<svg class="w-5 h-5 text-slate-800 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-[19px] font-bold text-slate-900 absolute left-1/2 -translate-x-1/2 tracking-tight">Sửa nhóm</h1>
<!-- Placeholder to balance flex space -->
<div class="w-10"></div>
</nav>
<!-- END: NavigationBar -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 overflow-y-auto px-5 pt-3 pb-24 space-y-6">
<!-- Section: Category Metadata Card -->
<section data-purpose="category-info-card">
<div class="bg-white rounded-[26px] p-2 shadow-card border border-slate-100 divide-y divide-slate-100">

<div class="flex items-center px-4 py-3.5 gap-4">

<div class="w-11 h-11 rounded-full bg-teal-900 flex items-center justify-center shrink-0 shadow-inner overflow-hidden relative">

</svg>
</div>
<!-- Category Title Text -->
<span class="text-[20px] font-bold text-slate-800 tracking-tight">Trả nợ</span>
</div>
<!-- Category Type (+/-) -->
<div class="flex items-center px-4 py-3.5 gap-4">
<!-- Icon +/- -->
<div class="w-11 h-11 flex items-center justify-center shrink-0">
<span class="text-2xl font-semibold text-slate-800 tracking-tighter leading-none select-none">⁺⁄₋</span>
</div>
<!-- Category Type Label -->
<span class="text-[16px] font-medium text-slate-700 tracking-tight">Khoản chi</span>
</div>
</div>
<!-- Footnote / System Warning -->
<p class="text-[13px] text-slate-500 font-normal px-2 mt-2.5 leading-relaxed tracking-tight">
          Đây là danh mục của hệ thống nên bạn không thể chỉnh sửa hoặc xóa bỏ.
        </p>
</section>
<!-- Section: Linked Wallets Card -->
<section class="pt-2" data-purpose="active-wallets-card">
<div class="bg-white rounded-[26px] p-4 shadow-card border border-slate-100">
<!-- Header of Section with Edit Action -->
<div class="flex items-center justify-between pb-3 pt-1">
<span class="text-[13.5px] font-medium text-slate-600 leading-snug">
              Nhóm thu chi này đang hoạt động ở các ví sau
            </span>
<button class="text-[15px] font-semibold text-emerald-500 hover:text-emerald-600 shrink-0 ml-2 active:opacity-75 transition-opacity">
              Sửa
            </button>
</div>
<!-- Wallet Items List -->
<div class="divide-y divide-slate-100 mt-1">
<!-- Wallet 1: Tiền Mặt -->
<div class="flex items-center py-3 gap-3.5">
<!-- Wallet Icon: Leather Wallet -->
<div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center shrink-0 shadow-sm">
<div class="w-6 h-5 bg-[#d97706] rounded-[4px] relative flex items-center justify-end px-0.5 shadow">
<div class="w-2.5 h-2 bg-[#b45309] rounded-l-[3px] absolute right-0 flex items-center justify-center">
<span class="w-1 h-1 bg-yellow-100 rounded-full"></span>
</div>
</div>
</div>
<span class="text-[16px] font-semibold text-slate-800 tracking-tight">Tiền Mặt</span>
</div>
<!-- Wallet 2: Techcombank -->
<div class="flex items-center py-3 gap-3.5">
<!-- Bank Icon: Techcombank geometric logo -->
<div class="w-10 h-10 rounded-full bg-slate-50 flex items-center justify-center shrink-0 border border-slate-100 shadow-sm">
<svg class="w-5 h-5 text-red-600" fill="currentColor" viewbox="0 0 24 24">
<!-- Two overlapping red diamond squares forming Techcombank emblem -->
<polygon fill="#e11d48" points="12,2 17,7 12,12 7,7"></polygon>
<polygon fill="#e11d48" points="12,12 17,17 12,22 7,17"></polygon>
<polygon fill="#e11d48" points="7,7 12,12 7,17 2,12"></polygon>
<polygon fill="#e11d48" points="17,7 22,12 17,17 12,12"></polygon>
</svg>
</div>
<span class="text-[16px] font-semibold text-slate-800 tracking-tight">Techcombank</span>
</div>
<!-- Wallet 3: Ví tín dụng -->
<div class="flex items-center py-3 gap-3.5">
<!-- Credit Card Icon: Teal styled -->
<div class="w-10 h-10 rounded-full bg-slate-600 flex items-center justify-center shrink-0 shadow-sm">
<div class="w-6 h-4 bg-teal-100 rounded-[3px] p-0.5 flex flex-col justify-between border border-teal-200">
<div class="w-full h-1 bg-teal-600 rounded-[1px]"></div>
<div class="w-2.5 h-0.5 bg-teal-500 rounded-[0.5px]"></div>
</div>
</div>
<span class="text-[16px] font-semibold text-slate-800 tracking-tight">Ví tín dụng</span>
</div>
</div>
</div>
</section>
</main>

<nav class="absolute bottom-0 inset-x-0 bg-white/95 backdrop-blur-md border-t border-slate-100 pt-2 pb-5 px-3 z-30 flex items-center justify-around shadow-[0_-4px_16px_rgba(0,0,0,0.02)]">

</svg>
<span class="text-[11px] font-medium tracking-tight">Sổ giao dịch</span>
</a>
<!-- Central Action FAB Button (+) -->
<div class="flex-1 flex justify-center items-center -mt-6">
<button aria-label="Thêm mới" class="w-13 h-13 p-3.5 rounded-full bg-[#22c55e] text-white shadow-fab flex items-center justify-center active:scale-90 transition-transform">
<svg class="w-6 h-6 stroke-[2.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Tab 3: Ngân sách -->
<a class="flex flex-col items-center justify-center flex-1 py-1 gap-1 text-slate-700 hover:text-slate-900 transition-colors" href="#">
<svg class="w-6 h-6 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16.5 8.25V6a2.25 2.25 0 00-2.25-2.25H6A2.25 2.25 0 003.75 6v8.25A2.25 2.25 0 006 16.5h2.25m8.25-8.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-7.5A2.25 2.25 0 018.25 18v-1.5m8.25-8.25h-6a2.25 2.25 0 00-2.25 2.25v6" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span class="text-[11px] font-medium tracking-tight">Ngân sách</span>
</a>
<!-- Tab 4: Tài khoản (Active Tab Pill) -->
<a class="flex flex-col items-center justify-center flex-1 py-1" href="#">
<div class="bg-slate-200/75 rounded-full px-4 py-1.5 flex flex-col items-center gap-0.5">
<svg class="w-5 h-5 text-slate-900 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>

</div>
</a>
</nav>
<!-- END: BottomNavigationBar -->
</div>
