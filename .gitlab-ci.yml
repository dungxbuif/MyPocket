workflow:
  rules:
    # Allow an owner-triggered production run as well as normal branch/tag and
    # merge-request pipelines from Auto DevOps.
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never

# Auto DevOps build/test jobs run on the lab's container build runner. The
# production migration job declares its protected VM100 deploy tag explicitly.
default:
  tags:
    - homelab-mac

# Auto DevOps normally places `build` before `test`. The release build has an
# explicit need on the MyPocket test gate, so keep the included stages but
# order test before build to make that DAG valid.
stages:
  - test
  - build
  - deploy
  - review
  - dast
  - staging
  - canary
  - production
  - incremental rollout 10%
  - incremental rollout 25%
  - incremental rollout 50%
  - incremental rollout 75%
  - incremental rollout 100%
  - performance
  - cleanup

# Keep the release-owned test gate below, but disable unrelated Auto DevOps
# analysis jobs. Their failures currently block delivery even when the reviewed
# MyPocket gate and immutable image build pass.
variables:
  TEST_DISABLED: "true"
  CODE_QUALITY_DISABLED: "true"
  CODE_INTELLIGENCE_DISABLED: "true"
  CONTAINER_SCANNING_DISABLED: "true"
  SECRET_DETECTION_DISABLED: "true"
  SAST_DISABLED: "true"
  DEPENDENCY_SCANNING_DISABLED: "true"
  DAST_DISABLED: "true"
  REVIEW_DISABLED: "true"
  BROWSER_PERFORMANCE_DISABLED: "true"
  LOAD_PERFORMANCE_DISABLED: "true"

# Auto DevOps' generic buildpack job cannot detect this Go service because the
# application Dockerfile lives under backend/. Override the included `build`
# job with the repository's reviewed multi-stage image build.
test:mypocket-release:
  stage: test
  image: golang:1.26
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - ./scripts/mypocket-promotion-contract.test.sh
    - cd backend
    - go test ./...
    - cd ..
    - ./scripts/mypocket-rollout-preflight.sh

build:
  stage: build
  image: docker:29.1-cli
  services:
    - name: docker:29.1.4-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    action: prepare
  needs:
    - job: test:mypocket-release
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
    - when: never
  script:
    - |
      set -eu
      : "${REGISTRY_USERNAME:?REGISTRY_USERNAME must be set for image publishing}"
      : "${REGISTRY_PASSWORD:?REGISTRY_PASSWORD must be set for image publishing}"
      image_tag="registry.dungxbuif.com/mypocket-api:${CI_COMMIT_SHA}"
      printf '%s' "${REGISTRY_PASSWORD}" | docker login registry.dungxbuif.com --username "${REGISTRY_USERNAME}" --password-stdin
      docker buildx create --name mypocket-builder --driver docker-container --use
      docker buildx build --pull \
        --platform linux/amd64,linux/arm64 \
        --file backend/Dockerfile \
        --tag "${image_tag}" \
        --push \
        --metadata-file build-metadata.json \
        .
      digest_ref="$(awk -F'"' '/"containerimage.digest"/ {print $4; exit}' build-metadata.json)"
      test -n "${digest_ref}"
      digest_ref="registry.dungxbuif.com/mypocket-api@${digest_ref}"
      case "${digest_ref}" in
        registry.dungxbuif.com/mypocket-api@sha256:*) ;;
        *) echo 'image push did not return an immutable registry digest' >&2; exit 1 ;;
      esac
      printf 'BUILT_IMAGE_REF=%s\n' "${digest_ref}" > build.env
  artifacts:
    reports:
      dotenv: build.env
    expire_in: 1 day

promote:homelab-ops:
  stage: deploy
  image: python:3.13-alpine
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^prod-(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$/'
    - when: never
  script:
    - |
      set -eu
      apk add --no-cache ca-certificates git
      : "${HOMELAB_OPS_PUSH_TOKEN:?HOMELAB_OPS_PUSH_TOKEN must be protected and masked}"
      : "${BUILT_IMAGE_REF:?build job did not publish BUILT_IMAGE_REF}"
      case "${BUILT_IMAGE_REF}" in
        registry.dungxbuif.com/mypocket-api@sha256:*) ;;
        *) echo 'promotion requires an immutable MyPocket registry digest' >&2; exit 1 ;;
      esac
      ops_url="${HOMELAB_OPS_REPO_URL:-https://gitlab.dungxbuif.com/dungxbuif/homelab-ops.git}"
      ops_dir="${CI_PROJECT_DIR}/.homelab-ops"
      git clone --branch main "https://oauth2:${HOMELAB_OPS_PUSH_TOKEN}@${ops_url#https://}" "$ops_dir"
      python3 - "$ops_dir/environments/prod/mypocket.json" "$CI_COMMIT_TAG" "$CI_COMMIT_SHA" "$BUILT_IMAGE_REF" <<'PY'
      import json
      import pathlib
      import sys

      path = pathlib.Path(sys.argv[1])
      source_tag, source_commit, image_ref = sys.argv[2:]
      data = json.loads(path.read_text())
      if data.get("app") != "mypocket":
          raise SystemExit("ops manifest is not the MyPocket manifest")
      data["source_tag"] = source_tag
      data["source_commit"] = source_commit
      data["promotion_tag"] = source_tag.replace("prod-", "mypocket-prod-", 1)
      data["image"] = image_ref
      data["migration"]["image"] = image_ref
      path.write_text(json.dumps(data, indent=2) + "\n")
      PY
      cd "$ops_dir"
      git config user.name "MyPocket release bot"
      git config user.email "release-bot@dungxbuif.com"
      git diff --exit-code -- environments/prod/mypocket.json >/dev/null && {
        echo 'promotion produced no manifest change' >&2
        exit 1
      }
      git add environments/prod/mypocket.json
      git commit -m "chore(release): promote mypocket ${CI_COMMIT_TAG#prod-}"
      # The generated main update does not need its branch pipeline. Skip only
      # this push; keep the commit itself eligible for the receipt-tag pipeline.
      git push -o ci.skip origin HEAD:main
      git tag -a "${CI_COMMIT_TAG/prod-/mypocket-prod-}" -m "MyPocket ${CI_COMMIT_TAG#prod-} production promotion"
      git push origin "${CI_COMMIT_TAG/prod-/mypocket-prod-}"

include:
  # Preserve GitLab's existing Auto DevOps flow for the normal pipeline.
  - template: Auto-DevOps.gitlab-ci.yml
  - local: .gitlab/ci/migrate-production.yml
